apiVersion: v1
kind: Service
metadata:
  name: todo-app
  labels:
    app: todo-app
    component: web
spec:
  type: {{ .Values.service.type }}
  selector:
    app: todo-app
    component: web
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
{{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
{{- end }}
