apiVersion: v1
kind: Service
metadata:
  name: todo-app
  namespace: todo-matrix
  labels:
    app: todo-app
    component: web
spec:
  type: NodePort
  selector:
    app: todo-app
    component: web
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
