stages:
  - test
  - build
  - publish

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  LATEST_TAG: $CI_REGISTRY_IMAGE:latest

test:
  stage: test
  image: python:3.12-alpine
  variables:
    TESTING: "true"
  before_script:
    - pip install pytest pytest-cov httpx
    - pip install -r requirements.txt
  script:
    - echo "ЗАПУСК ВСЕХ ТЕСТОВ..."
    - python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --junitxml=junit.xml --cov-fail-under=70
    - echo "ТЕСТЫ ПРОЙДЕНЫ, ПОКРЫТИЕ >70%!"
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week

build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - docker build -t $IMAGE_TAG .
  only:
    - main
    - develop

publish:
  stage: publish
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker tag $IMAGE_TAG $LATEST_TAG
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG
  only:
    - main
  when: manual

deploy:
  stage: publish
  script:
    - echo "ГОТОВО К ДЕПЛОЮ"
  environment:
    name: production
  only:
    - main
  when: manual